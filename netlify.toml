[build]
  publish = "src"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/reservation-classique"
  to = "/reservation-classique.html"
  status = 200

[[redirects]]
  from = "/reservation-anniversaire"
  to = "/reservation-anniversaire.html"
  status = 200

[[redirects]]
  from = "/battle-royale"
  to = "/"
  status = 302
  force = true

# Battle Royale en pause : conserver les fichiers et remettre la route en 200 à la reprise.
[[redirects]]
  from = "/battle-royale.html"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/tableau"
  to = "/tableau.html"
  status = 200
